version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One pull request for routine patch bumps; anything that could actually
      # break gets its own, so it can be reviewed on its merits.
      go-patch:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Routine bumps together, as for Go; a major one gets its own pull
      # request rather than riding along with three patches.
      web-dev:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # SvelteKit 3 and svelte-check declare a peer dependency of typescript
      # ^6, so a major bump waits until they move. openapi-typescript still
      # says ^5.x and is handed 6 by an override in web/package.json, which
      # holds only because the types it writes from the spec came out the
      # same; a TypeScript major is where that has to be checked again.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
