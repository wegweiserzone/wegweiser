version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One pull request for routine patch bumps; anything that could actually
      # break gets its own, so it can be reviewed on its merits.
      go-patch:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-dev:
        dependency-type: development
    ignore:
      # openapi-typescript declares a peer dependency of typescript ^5.x, and
      # the generated client is what the interface is built against. Major
      # bumps stay out until that peer range moves.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
