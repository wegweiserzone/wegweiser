name: Bug report
description: Something Wegweiser does that it should not
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A vulnerability goes to [SECURITY.md](https://github.com/wegweiserzone/wegweiser/blob/main/SECURITY.md) instead, privately.

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: >-
        For anything the server answers, a `dig` command is worth more than a
        description: it says what was asked as well as what came back.
      render: console
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Version and platform
      description: The output of `weg version --output json`.
      render: json
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where it shows
      options:
        - The answers the server gives
        - Zone transfer or NOTIFY
        - The API
        - The command line
        - The web interface
        - Somewhere else
    validations:
      required: true
